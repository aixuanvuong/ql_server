<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Server Rack Shape -->
  <g transform="translate(96, 96)">
    <!-- Top Rack Unit -->
    <rect x="0" y="20" width="320" height="74" rx="18" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <circle cx="44" cy="57" r="9" fill="#10b981" filter="url(#glow)"/>
    <circle cx="76" cy="57" r="9" fill="#06b6d4"/>
    <circle cx="108" cy="57" r="9" fill="#8b5cf6"/>
    <line x1="160" y1="57" x2="280" y2="57" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- Middle Rack Unit -->
    <rect x="0" y="122" width="320" height="74" rx="18" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <circle cx="44" cy="159" r="9" fill="#10b981" filter="url(#glow)"/>
    <circle cx="76" cy="159" r="9" fill="#10b981" filter="url(#glow)"/>
    <circle cx="108" cy="159" r="9" fill="#f59e0b"/>
    <line x1="160" y1="159" x2="280" y2="159" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- Bottom Rack Unit with Terminal Prompt -->
    <rect x="0" y="224" width="320" height="74" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
    <path d="M 38 248 L 56 261 L 38 274" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="72" y1="274" x2="106" y2="274" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
    <circle cx="276" cy="261" r="10" fill="#10b981" filter="url(#glow)"/>
  </g>
</svg>
